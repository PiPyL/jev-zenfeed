<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Jev content-script harness</title>
  <!--
    Browser test for the content scripts (real files, manifest order) against a
    fake Facebook DOM and a fake chrome.* API.
    Run: npm run harness  → open http://localhost:8765/test/content-harness.html
    Result: the page lists PASS/FAIL; window.__harnessResult = { passed, failed, done }.
  -->
  <link rel="stylesheet" href="../src/content/content.css">
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; }
    #results { position: fixed; right: 8px; top: 8px; width: 420px; max-height: 95vh; overflow: auto;
      background: #fff; border: 1px solid #ccc; padding: 8px; font-size: 12px; z-index: 1000; }
    .pass { color: #0a7a2f; } .fail { color: #c00; font-weight: bold; }
    [role="feed"] > div { border: 1px solid #ddd; margin: 4px 0; padding: 6px; width: 420px; min-height: 40px; }
  </style>
</head>
<body>
  <div id="results"><b>Jev content harness</b><div id="log"></div></div>
  <!-- Pushes every post below the fold by default, so all existing assertions
       (immediate banner collapse) still describe an off-screen post — matching
       the "reading zone" contract in content.js. Reading-zone-specific tests
       below scroll individual posts into view explicitly. Sized in JS (below)
       as a fraction of the actual viewport height: tall enough to clear the
       reading zone (top ~65%), short enough to stay within the default
       look-ahead/prefetch reach (~2x viewport) so posts are still evaluated
       on load, whatever the real window size turns out to be. -->
  <div id="spacer"></div>
  <div role="main" id="main"></div>

  <script>
    // ==================== Fake chrome.* ====================
    const store = {
      extensionEnabled: true, filterCriteria: 'cá độ', confidenceThreshold: 70,
      hideMode: 'banner', filterMode: 'smooth', apiKey: 'secret-key', apiUrl: 'http://localhost:3000'
    };
    const changeListeners = [];
    const requestedKeys = new Set();
    const calls = [];                 // every EVALUATE_BATCH payload
    const messages = [];              // every other runtime message
    let backendMode = 'ok';           // 'ok' | 'error'
    let backendDelayMs = 60;          // bumped for the strict-mode "pending" test below

    function backend(items) {
      calls.push(items);
      const crit = String(store.filterCriteria || '').toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
      return new Promise((resolve, reject) => setTimeout(() => {
        // Real Chrome rejects in-flight messages when the extension context dies.
        if (!chrome.runtime.id) { reject(new Error('Extension context invalidated.')); return; }
        resolve(items.map(i => {
          if (backendMode === 'error') return { id: i.id, shouldHide: false, confidence: 0, error: true };
          const hit = crit.some(c => i.text.toLowerCase().includes(c));
          return { id: i.id, shouldHide: hit && 90 >= store.confidenceThreshold, confidence: hit ? 90 : 3 };
        }));
      }, backendDelayMs));
    }

    window.chrome = {
      runtime: {
        id: 'harness',
        sendMessage(msg) {
          // Real Chrome throws synchronously when an orphaned content script
          // (extension reloaded/updated) touches chrome.runtime.
          if (!chrome.runtime.id) throw new Error('Extension context invalidated.');
          if (msg.action === 'EVALUATE_BATCH') return backend(msg.items);
          messages.push(msg);
          return Promise.resolve();
        },
        onMessage: { addListener() {} }
      },
      storage: {
        local: {
          get(keys, cb) {
            const out = {};
            Object.entries(keys).forEach(([k, d]) => { requestedKeys.add(k); out[k] = k in store ? store[k] : d; });
            setTimeout(() => cb(out), 0);
          },
          set(obj) {
            const changes = {};
            Object.entries(obj).forEach(([k, v]) => { changes[k] = { oldValue: store[k], newValue: v }; store[k] = v; });
            setTimeout(() => changeListeners.forEach(l => l(changes, 'local')), 0);
            return Promise.resolve();
          }
        },
        onChanged: { addListener(l) { changeListeners.push(l); } }
      }
    };

    // Between the reading zone (65% of viewport) and the default prefetch
    // reach (viewport + 100%) for ANY viewport size — see the comment on
    // #spacer above.
    document.getElementById('spacer').style.height = `${Math.round((window.innerHeight || 800) * 0.9)}px`;
    // Guarantees a large scrollable range from the very start, independent of
    // how much test content has been appended so far — used below to force
    // the adaptive prefetch margin to its widest bucket in one early scroll.
    document.body.style.minHeight = '8000px';

    // ==================== Fake Facebook DOM ====================
    function postHTML({ author, body, comments = [], useMarker = true }) {
      const bodyHtml = useMarker
        ? `<div data-ad-preview="message"><div dir="auto">${body}</div></div>`
        : `<div dir="auto"><div dir="auto">${body.split('|')[0]}</div><div dir="auto">${body.split('|')[1] || ''}</div></div>`;
      const commentsHtml = comments.length
        ? `<ul>${comments.map(c => `<li><div role="article" aria-label="Bình luận của X"><span dir="auto">${c}</span></div></li>`).join('')}</ul>`
        : '';
      return `<div><h3><a role="link"><strong>${author}</strong></a></h3>${bodyHtml}
        <div role="toolbar"><span dir="auto">Thích</span></div>${commentsHtml}</div>`;
    }
    function makeFeed(posts) {
      const feed = document.createElement('div');
      feed.setAttribute('role', 'feed');
      posts.forEach(p => {
        const unit = document.createElement('div');
        unit.id = p.id;
        unit.innerHTML = postHTML(p);
        feed.appendChild(unit);
      });
      return feed;
    }
    document.getElementById('main').appendChild(makeFeed([
      { id: 'A', author: 'Nhà cái X', body: 'Kèo cá độ bóng đá đêm nay, vào ngay!' },
      { id: 'B', author: 'Bạn Lan', body: 'Hôm nay mình đi dạo công viên rất vui' },
      { id: 'C', author: 'Bạn Minh', body: 'Ảnh con mèo nhà mình dễ thương quá', comments: ['Ai muốn cá độ không, ib'] },
      { id: 'D1', author: 'Quảng cáo Y', body: 'Nhận cá độ tỉ số, hoàn tiền 100%' },
      { id: 'D2', author: 'Quảng cáo Y', body: 'Nhận cá độ tỉ số, hoàn tiền 100%' },
      { id: 'E', author: 'Bạn Hoa', body: 'Đoạn một của bài viết dài|Đoạn hai của bài viết dài', useMarker: false }
    ]));
  </script>

  <!-- Real content scripts, manifest order -->
  <script src="../src/utils/settings-defaults.js"></script>
  <script src="../src/utils/i18n.js"></script>
  <script src="../src/utils/fast-hash.js"></script>
  <script src="../src/utils/clip-text.js"></script>
  <script src="../src/utils/zen-data.js"></script>
  <script src="../src/utils/flashcards-data.js"></script>
  <script src="../src/content/fb-selectors.js"></script>
  <script src="../src/content/text-extractor.js"></script>
  <script src="../src/content/ui-overlay.js"></script>
  <script src="../src/content/content.js"></script>

  <script>
    const results = { passed: 0, failed: 0, done: false, failures: [] };
    window.__harnessResult = results;
    const $ = (id) => document.getElementById(id);
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const status = (id) => $(id).dataset.jevStatus;
    const isCollapsed = (id) => $(id).classList.contains('jev-post-collapsed');
    const bannerOf = (id) => $(id).querySelector(':scope > .jev-banner');
    const allItems = () => calls.flat();
    // Scroll an element into the "reading zone" (top of viewport) / back out
    // of it (to the empty spacer at the very top of the page).
    const showInReadingZone = (el) => window.scrollTo(0, window.scrollY + el.getBoundingClientRect().top - 20);
    const scrollAway = () => window.scrollTo(0, 0);
    // Poll instead of a fixed sleep for anything racing a mocked network
    // delay or the scan/registration throttle — keeps the suite reliable
    // regardless of how fast/slow the host happens to run right now.
    async function waitFor(predicate, timeoutMs = 3000, stepMs = 25) {
      const start = performance.now();
      while (performance.now() - start < timeoutMs) {
        if (predicate()) return true;
        await sleep(stepMs);
      }
      return !!predicate();
    }

    function check(name, cond, detail = '') {
      const line = document.createElement('div');
      if (cond) { results.passed++; line.className = 'pass'; line.textContent = `PASS ${name}`; }
      else { results.failed++; results.failures.push(name); line.className = 'fail'; line.textContent = `FAIL ${name} ${detail}`; }
      $('log').appendChild(line);
    }

    async function run() {
      // Force the adaptive prefetch margin (content.js) to its widest bucket
      // up front, so every post appended later in this long-running test
      // stays within the AI look-ahead reach no matter how much content piles
      // up above it. The reading-zone cutoff used by the hide-decision matrix
      // is independent of this margin and stays fixed regardless.
      window.scrollTo(0, 1);
      await sleep(150);
      window.scrollTo(0, 6000);
      await sleep(150);
      window.scrollTo(0, 0);
      await sleep(700);

      // --- Initial evaluation ---
      check('Không đọc apiKey/apiUrl từ storage', !requestedKeys.has('apiKey') && !requestedKeys.has('apiUrl'), [...requestedKeys].join(','));
      const previewCard = document.createElement('div');
      previewCard.innerHTML = '<span data-ad-rendering-role="profile_name"><a role="link">Page</a></span><div data-ad-preview="message"><div dir="auto">Xem ngay kẻo lỡ</div></div><div data-ad-preview="title">Kèo cá độ bóng đá hôm nay</div>';
      const previewData = JevFB.extractPostData(previewCard);
      check('Tiêu đề link preview được đưa vào nội dung lọc', !!(previewData && previewData.text.includes('Kèo cá độ bóng đá hôm nay')), previewData && previewData.text);
      const shortAd = document.createElement('div');
      shortAd.innerHTML = '<span data-ad-rendering-role="profile_name"><a role="link">Page</a></span><div data-ad-preview="message"><div dir="auto">Nổ hũ</div></div><img alt="game bài đổi thưởng">';
      const shortData = JevFB.extractPostData(shortAd);
      check('Bài ngắn có ảnh không bị bỏ qua', !!(shortData && !shortData.notReady && shortData.text.includes('Nổ hũ')), shortData && shortData.text);
      const head = 'A'.repeat(700);
      const tail = 'Z'.repeat(300);
      const midCard = (marker) => {
        const el = document.createElement('div');
        el.innerHTML = `<span data-ad-rendering-role="profile_name"><a role="link">Same</a></span><div data-ad-preview="message"><div dir="auto">${head}${marker}${tail}</div></div>`;
        return JevFB.extractPostData(el);
      };
      const midA = midCard('MIDDLE_ONE');
      const midB = midCard('MIDDLE_TWO');
      check('Hai bài khác đoạn giữa không dùng chung hash', !!(midA && midB && midA.hash !== midB.hash && JevFB.clipPostText(midA.text).includes('MIDDLE_ONE')));
      check('Bài vi phạm A bị thu gọn bằng banner', status('A') === 'hidden' && isCollapsed('A') && !!bannerOf('A'));
      check('Bài an toàn B hiển thị bình thường', status('B') === 'safe' && !$('B').classList.contains('jev-analyzing'));
      check('Bình luận KHÔNG ảnh hưởng quyết định (C an toàn)', status('C') === 'safe');
      const cItem = allItems().find(i => i.text.includes('con mèo'));
      check('Nội dung bình luận không bị gửi đi', cItem && !cItem.text.includes('ib'), cItem && cItem.text);
      check('Hai bài trùng nội dung đều bị ẩn, không kẹt blur',
        status('D1') === 'hidden' && status('D2') === 'hidden' &&
        !$('D1').classList.contains('jev-analyzing') && !$('D2').classList.contains('jev-analyzing'));
      const dIds = allItems().filter(i => i.text.includes('tỉ số')).map(i => i.id);
      check('Mỗi phần tử có id riêng', new Set(dIds).size === dIds.length && dIds.length === 2, dIds.join(','));
      const eItem = allItems().find(i => i.text.includes('Đoạn một'));
      check('Đoạn văn lồng nhau không bị gửi lặp',
        eItem && eItem.text.split('Đoạn một').length === 2 && eItem.text.split('Đoạn hai').length === 2, eItem && JSON.stringify(eItem.text));
      const aItem = allItems().find(i => i.text.includes('Kèo'));
      check('Tác giả được trích đúng', aItem && aItem.author === 'Nhà cái X', aItem && aItem.author);

      // --- Re-check of hidden post: no re-evaluation, no flicker, reveal preserved ---
      bannerOf('A').querySelector('.jev-btn-reveal').click();
      check('Bấm "Xem nội dung" mở bài', $('A').classList.contains('jev-revealed') && !isCollapsed('A'));
      const callsBefore = calls.length;
      const bannerNode = bannerOf('A');
      document.body.appendChild(document.createElement('div')); // mutation → scan + visible re-check
      await sleep(1600);
      document.body.appendChild(document.createElement('div'));
      await sleep(600);
      check('Bài đã ẩn KHÔNG bị gửi lại API khi kiểm tra lại', calls.length === callsBefore, `${calls.length - callsBefore} lần gọi thêm`);
      check('Banner giữ nguyên & trạng thái "đã mở" được giữ', bannerOf('A') === bannerNode && $('A').classList.contains('jev-revealed'));

      // --- hideMode change → blur, control tag not blurred ---
      chrome.storage.local.set({ hideMode: 'blur', blurPreset: 'classic' });
      await sleep(200);
      const tag = $('A').querySelector(':scope > .jev-blur-tag');
      const firstChild = [...$('A').children].find(c => !c.classList.contains('jev-ui'));
      check('Đổi chế độ hiển thị áp dụng ngay cho bài đã ẩn', $('A').classList.contains('jev-blurred-post') && !!tag && !bannerOf('A'));
      check('Nút mở trong chế độ Blur không bị làm mờ',
        tag && getComputedStyle(tag).filter === 'none' && getComputedStyle(firstChild).filter.includes('blur'),
        tag && getComputedStyle(tag).filter);
      check('Chế độ Blur không bóp nghẹt chiều cao post (không đổi kích thước)',
        getComputedStyle($('A')).maxHeight === 'none');
      chrome.storage.local.set({ hideMode: 'banner' });
      await sleep(200);

      // --- Disable / enable ---
      chrome.storage.local.set({ extensionEnabled: false });
      await sleep(200);
      check('Tắt bộ lọc hiển thị lại mọi bài ngay', !isCollapsed('A') && !bannerOf('A') && !status('A') && !isCollapsed('D1'));
      chrome.storage.local.set({ extensionEnabled: true });
      await sleep(600);
      check('Bật lại bộ lọc ẩn lại bài vi phạm', status('A') === 'hidden' && isCollapsed('A'));

      // --- Criteria change (also exercises the reading-zone matrix on B) ---
      // B has been sitting off-screen and safe this whole time. Bring it into
      // the reading zone and let it sit there past CLEAR_SEEN_MS BEFORE it
      // becomes a violation, so the decision arrives for an "already read"
      // post -> corner label, not a blur/collapse.
      showInReadingZone($('B'));
      await sleep(800);
      chrome.storage.local.set({ filterCriteria: 'công viên' });
      await waitFor(() => status('A') === 'safe' && status('B') === 'hidden');
      check('Đổi tiêu chí: bài không còn khớp được hiện lại', status('A') === 'safe' && !isCollapsed('A'));
      check('Đổi tiêu chí: bài đã đọc lâu -> chỉ gắn nhãn góc, KHÔNG thu gọn/mờ ngay',
        status('B') === 'hidden' && !isCollapsed('B') && !$('B').classList.contains('jev-blurred-post') &&
        !!$('B').querySelector(':scope > .jev-corner-label') && !bannerOf('B'), status('B'));
      scrollAway();
      await waitFor(() => isCollapsed('B'));
      check('Cuộn bài đã gắn nhãn ra khỏi màn hình sẽ thu gọn thật',
        status('B') === 'hidden' && isCollapsed('B') && !!bannerOf('B') && !$('B').querySelector(':scope > .jev-corner-label'));
      chrome.storage.local.set({ filterCriteria: 'cá độ' });
      await waitFor(() => status('A') === 'hidden' && status('B') === 'safe');
      check('Khôi phục tiêu chí', status('A') === 'hidden' && status('B') === 'safe');

      // --- Facebook recycles a DOM node with new content ---
      $('B').innerHTML = postHTML({ author: 'Nhà cái Z', body: 'Bài mới: cá độ xóc đĩa online uy tín' });
      await sleep(1700);
      check('Node bị tái sử dụng với nội dung mới được đánh giá lại', status('B') === 'hidden', status('B'));

      // --- SPA navigation: feed replaced ---
      $('main').innerHTML = '';
      $('main').appendChild(makeFeed([
        { id: 'G1', author: 'Nhóm ABC', body: 'Nhóm chuyên cá độ bóng rổ NBA' },
        { id: 'G2', author: 'Nhóm ABC', body: 'Chia sẻ lịch tập bóng rổ cuối tuần' }
      ]));
      await waitFor(() => status('G1') === 'hidden' && status('G2') === 'safe');
      check('Điều hướng SPA: feed mới vẫn được lọc', status('G1') === 'hidden' && status('G2') === 'safe', `${status('G1')}/${status('G2')}`);

      // --- API error → no stuck blur, retried silently later ---
      backendMode = 'error';
      const feed = document.querySelector('[role="feed"]');
      const unit = document.createElement('div');
      unit.id = 'H';
      unit.innerHTML = postHTML({ author: 'Trang K', body: 'Tham gia cá độ ngay hôm nay' });
      feed.appendChild(unit);
      await waitFor(() => !$('H').classList.contains('jev-analyzing') && status('H') !== 'analyzing');
      check('Lỗi API: bài không bị kẹt blur', !$('H').classList.contains('jev-analyzing') && status('H') !== 'analyzing');
      backendMode = 'ok';
      document.body.appendChild(document.createElement('div'));
      await sleep(1600);
      check('Sau khi API hồi phục, bài được thử lại và ẩn', status('H') === 'hidden', status('H'));

      // --- Modern FB markup: no role=feed/article, ad-rendering markers only ---
      const modern = document.createElement('div');
      modern.innerHTML = ['M1|Trang M|Nhận cá độ bóng đá uy tín', 'M2|Bạn N|Chiều nay trời đẹp quá mọi người'].map(r => {
        const [id, author, body] = r.split('|');
        return `<div><div data-virtualized="false" id="V${id}"><div id="${id}" class="card">
          <div><span data-ad-rendering-role="profile_name"><a role="link">${author}</a></span></div>
          <div data-ad-rendering-role="story_message"><div dir="auto">${body}</div></div>
          <div><img alt="ảnh"></div>
          <div><div role="button" aria-label="Thích">Thích</div><div role="button" aria-label="Bình luận">Bình luận</div></div>
          <div role="article" aria-label="Bình luận dưới tên X"><span dir="auto">cá độ không bạn ơi</span></div>
        </div></div></div>`;
      }).join('');
      document.getElementById('main').appendChild(modern);
      await sleep(1200);
      const outerM1 = $('VM1');
      check('FB mới: ẩn CẢ khung bài (không chỉ phần chữ)', outerM1.dataset.jevStatus === 'hidden' && outerM1.classList.contains('jev-post-collapsed'), outerM1.dataset.jevStatus);
      check('FB mới: bài an toàn không bị ẩn, bình luận không bị coi là bài',
        $('VM2').dataset.jevStatus === 'safe' && !document.querySelector('[role="article"][data-jev-status]'));

      // --- Messenger chat: a shared post preview inside a message is NOT a feed post ---
      // Regression: chat bubbles reuse the feed's ad-rendering markers, so the
      // scanner used to classify private messages and inject the banner into
      // the conversation. Both chat markers are covered: the MWChat pagelet
      // (chat overlay / messages page) and role="row" (message grid row).
      const callsBeforeChat = calls.length;
      const chat = document.createElement('div');
      chat.innerHTML = `<div data-pagelet="MWChat"><div role="grid" aria-label="Tin nhắn">
        <div role="row"><div id="CHAT1"><div data-virtualized="false">
          <div><span data-ad-rendering-role="profile_name"><a role="link">Anh Huy</a></span></div>
          <div data-ad-rendering-role="story_message"><div dir="auto">Kèo cá độ gửi qua tin nhắn riêng tư</div></div>
          <div><div role="button" aria-label="Thích">Thích</div></div>
        </div></div></div></div></div>`;
      document.getElementById('main').appendChild(chat);
      document.body.appendChild(document.createElement('div'));
      await sleep(1800);
      check('Tin nhắn Messenger (bài được chia sẻ) KHÔNG bị xử lý như bài feed',
        !$('CHAT1').dataset.jevStatus && !$('CHAT1').hasAttribute('data-jev-status') &&
        !chat.querySelector('.jev-ui') &&
        !allItems().some(i => i.text && i.text.includes('tin nhắn riêng tư')) &&
        calls.length === callsBeforeChat,
        `status=${$('CHAT1').dataset.jevStatus}, +${calls.length - callsBeforeChat} calls`);

      // --- Hidden post must stay stable (no blur -> hide -> blur -> hide loop) ---
      const loopWrap = document.createElement('div');
      loopWrap.innerHTML = `<div data-virtualized="false" id="VL"><div class="card">
        <div><span data-ad-rendering-role="profile_name"><a role="link">Nhà cái Q</a></span></div>
        <div data-ad-rendering-role="story_message"><div dir="auto">Dòng một: cá độ bóng đá</div><div dir="auto">Dòng hai: nạp tiền nhận thưởng</div></div>
        <div><div role="button" aria-label="Thích">Thích</div></div>
      </div></div>`;
      document.getElementById('main').appendChild(loopWrap);
      await sleep(1200);
      const vl = $('VL');
      check('Bài nhiều dòng được ẩn', vl.dataset.jevStatus === 'hidden', vl.dataset.jevStatus);
      const callsLoop = calls.length;
      const bannerLoop = bannerOf('VL');
      let flashed = false;
      const obs = new MutationObserver(() => { if (vl.classList.contains('jev-analyzing') || vl.dataset.jevStatus !== 'hidden') flashed = true; });
      obs.observe(vl, { attributes: true });
      await sleep(4500); // > 2 heartbeats
      check('Bài đã ẩn không nhấp nháy mờ/hiện lại', !flashed && vl.dataset.jevStatus === 'hidden');
      check('Bài đã ẩn không bị gửi lại API khi quét định kỳ', calls.length === callsLoop, `${calls.length - callsLoop} lần gọi thêm`);
      check('Banner giữ nguyên node', bannerOf('VL') === bannerLoop);
      bannerOf('VL').querySelector('.jev-btn-reveal').click();
      await sleep(4500);
      obs.disconnect();
      check('Đã bấm Xem: bài vẫn mở, không bị ẩn lại', vl.classList.contains('jev-revealed') && !isCollapsed('VL') && calls.length === callsLoop);

      // --- Blur mode: a user reveal must survive Facebook's own DOM mutations ---
      // Regression: revealing dropped the blur tag — the only .jev-ui artifact
      // of a blur-hidden post — so the repair pass treated the artifact as
      // "missing" and re-blurred the post the moment FB updated a timestamp.
      chrome.storage.local.set({ hideMode: 'blur' });
      await sleep(300);
      const rbWrap = document.createElement('div');
      rbWrap.innerHTML = `<div data-virtualized="false" id="RB"><div class="card">
        <div><span data-ad-rendering-role="profile_name"><a role="link">Nhà cái R</a></span></div>
        <div data-ad-rendering-role="story_message"><div dir="auto">Kèo cá độ cuối tuần, thưởng nạp đầu</div></div>
        <div><div role="button" aria-label="Thích">Thích</div></div>
      </div></div>`;
      document.getElementById('main').appendChild(rbWrap);
      await waitFor(() => $('RB') && $('RB').classList.contains('jev-blurred-post'), 4000);
      check('Blur mode: bài vi phạm bị làm mờ kèm tag điều khiển',
        status('RB') === 'hidden' && $('RB').classList.contains('jev-blurred-post') &&
        !!$('RB').querySelector(':scope > .jev-blur-tag'), status('RB'));
      showInReadingZone($('RB'));
      await sleep(400);
      $('RB').querySelector('.jev-btn-show').click();
      check('Blur mode: bấm "Xem nội dung" mở bài',
        $('RB').classList.contains('jev-revealed') && !$('RB').classList.contains('jev-blurred-post') &&
        !$('RB').querySelector(':scope > .jev-blur-tag'));
      const callsBeforeRB = calls.length;
      // Facebook mutates the card in place (a timestamp appears): signature
      // changes, the cached verdict still stands, the repair pass wakes up.
      const ts = document.createElement('span');
      ts.textContent = ' · 2 phút';
      $('RB').querySelector('[data-ad-rendering-role="story_message"]').appendChild(ts);
      await sleep(4500); // > 2 heartbeats, post still sitting in the reading zone
      check('Blur mode: bài đã mở KHÔNG bị làm mờ/gắn nhãn lại khi FB tự đổi DOM',
        $('RB').classList.contains('jev-revealed') && !$('RB').classList.contains('jev-blurred-post') &&
        !$('RB').querySelector(':scope > .jev-blur-tag') && !$('RB').querySelector(':scope > .jev-corner-label'));
      check('Blur mode: không gọi lại API cho bài đã mở', calls.length === callsBeforeRB, `${calls.length - callsBeforeRB} lần gọi thêm`);
      scrollAway();
      await sleep(400);
      chrome.storage.local.set({ hideMode: 'banner' });
      await sleep(300);


      // --- First screen: text revealed by a style change only (no childList mutation) ---
      const lazy = document.createElement('div');
      lazy.id = 'L';
      lazy.innerHTML = postHTML({ author: 'Trang L', body: 'Khuyến mãi cá độ nạp đầu x2' });
      lazy.querySelector('[data-ad-preview]').style.display = 'none';
      document.querySelector('[role="feed"]').appendChild(lazy);
      await sleep(2000); // extraction retries exhausted while text is hidden
      lazy.querySelector('[data-ad-preview]').style.display = '';
      await sleep(2800);
      check('Bài hiện chữ muộn (không có node mới) vẫn tự được quét', status('L') === 'hidden', status('L'));

      // --- Toolbar badge: hidden count reported to the worker ---
      const tabStatus = messages.filter(m => m.action === 'TAB_STATUS');
      check('Báo số bài đã ẩn cho badge', tabStatus.length > 0 && tabStatus[tabStatus.length - 1].hidden > 0,
        JSON.stringify(tabStatus.slice(-1)));

      // --- "See more": small growth keeps the decision, large growth re-checks silently ---
      const g2msg = $('G2').querySelector('[data-ad-preview="message"] div');
      const callsExpand = calls.length;
      g2msg.textContent += ' thêm vài chữ nhỏ';
      document.body.appendChild(document.createElement('div'));
      await sleep(1800);
      check('Text tăng ít (Xem thêm/alt) KHÔNG gửi lại API', calls.length === callsExpand && status('G2') === 'safe',
        `${calls.length - callsExpand} lần gọi thêm`);
      let blurredOnExpand = false;
      const expObs = new MutationObserver(() => { if ($('G2').classList.contains('jev-analyzing')) blurredOnExpand = true; });
      expObs.observe($('G2'), { attributes: true });
      g2msg.textContent += ' Đoạn mở rộng rất dài của bài viết sau khi bấm Xem thêm, nội dung mới xuất hiện nhiều hơn hẳn so với bản rút gọn ban đầu.';
      document.body.appendChild(document.createElement('div'));
      await sleep(1800);
      expObs.disconnect();
      check('Text tăng nhiều được kiểm tra lại (không làm mờ)', calls.length === callsExpand + 1 && !blurredOnExpand,
        `${calls.length - callsExpand} lần gọi, blur=${blurredOnExpand}`);

      // --- "Ẩn nhầm" button ---
      const safeBtn = bannerOf('G1') && bannerOf('G1').querySelector('.jev-btn-safe');
      check('Banner có nút "Ẩn nhầm"', !!safeBtn);
      check('Chế độ ẩn: nút "Ẩn nhầm" không hiển thị', safeBtn && getComputedStyle(safeBtn).display === 'none');
      const revealBtn = bannerOf('G1') && bannerOf('G1').querySelector('.jev-btn-reveal');
      revealBtn && revealBtn.click();
      check('Chế độ xem: nút "Ẩn nhầm" hiển thị', safeBtn && getComputedStyle(safeBtn).display !== 'none');
      const callsSafe = calls.length;
      safeBtn && safeBtn.click();
      await sleep(100);
      const markMsg = messages.find(m => m.action === 'MARK_SAFE');
      check('"Ẩn nhầm" hiện lại bài và báo cho worker', status('G1') === 'safe' && !bannerOf('G1') && !isCollapsed('G1') &&
        markMsg && /^[0-9a-f]+$/.test(markMsg.hash), JSON.stringify(markMsg));
      document.body.appendChild(document.createElement('div'));
      await sleep(1800);
      check('Bài đã báo ẩn nhầm không bị ẩn lại / gửi lại', status('G1') === 'safe' && calls.length === callsSafe);

      // A generous, fixed backend delay for the rest of these tests: long
      // enough that "still mid-flight" checks have comfortable headroom
      // however fast/slow this machine happens to run right now, while every
      // "wait for the eventual outcome" check below polls (waitFor) instead
      // of sleeping a guessed duration.
      backendDelayMs = 400;

      // --- Reading zone: bài mới trong vùng đọc bị vi phạm -> thu gọn thành banner ngay theo đúng hideMode: 'banner' ---
      const fresh = document.createElement('div');
      fresh.id = 'RZ_FRESH';
      fresh.innerHTML = postHTML({ author: 'Trang F', body: 'Kèo cá độ tối nay siêu hot' });
      document.querySelector('[role="feed"]').appendChild(fresh);
      showInReadingZone($('RZ_FRESH'));
      await sleep(400); // registration done
      check('Chế độ Mượt: bài mới trong vùng đọc KHÔNG bị mờ trong lúc chờ AI',
        !$('RZ_FRESH').classList.contains('jev-blurred-post') && !$('RZ_FRESH').querySelector(':scope > .jev-blur-tag-pending'));
      await waitFor(() => status('RZ_FRESH') === 'hidden');
      check('Chế độ Banner: bài mới trong vùng đọc vi phạm -> thu gọn thành banner ngay, không hiển thị giao diện mờ',
        status('RZ_FRESH') === 'hidden' && isCollapsed('RZ_FRESH') && !!bannerOf('RZ_FRESH') &&
        !$('RZ_FRESH').classList.contains('jev-blurred-post'));
      scrollAway();
      await sleep(200);
      check('Cuộn ra khỏi màn hình: banner vẫn hiển thị ổn định',
        status('RZ_FRESH') === 'hidden' && isCollapsed('RZ_FRESH') && !!bannerOf('RZ_FRESH'));

      // --- Reading zone: the user interacting with a post exempts it from
      // ever being auto-collapsed, even fresh, even after it scrolls away ---
      backendDelayMs = 1200;
      const inter = document.createElement('div');
      inter.id = 'RZ_INTERACTED';
      inter.innerHTML = postHTML({ author: 'Trang I', body: 'Kèo cá độ cực đỉnh hôm nay' });
      document.querySelector('[role="feed"]').appendChild(inter);
      showInReadingZone($('RZ_INTERACTED')); // in place before the first scan, same reason as RZ_FRESH above
      await sleep(400); // scanned & registered (click listener attached) before we click it below
      $('RZ_INTERACTED').querySelector('[role="toolbar"]').click(); // simulate Like, before the decision lands
      await waitFor(() => status('RZ_INTERACTED') === 'hidden');
      check('Đã tương tác: quyết định ẩn chỉ gắn nhãn góc dù bài còn mới',
        status('RZ_INTERACTED') === 'hidden' && !!$('RZ_INTERACTED').querySelector(':scope > .jev-corner-label') &&
        !$('RZ_INTERACTED').classList.contains('jev-blurred-post') && !bannerOf('RZ_INTERACTED'), status('RZ_INTERACTED'));
      scrollAway();
      await sleep(300); // interacted -> no auto-collapse should happen; give it a real chance to (wrongly) fire
      check('Đã tương tác: cuộn qua vẫn KHÔNG tự thu gọn (tôn trọng người dùng)',
        status('RZ_INTERACTED') === 'hidden' && !isCollapsed('RZ_INTERACTED') &&
        !!$('RZ_INTERACTED').querySelector(':scope > .jev-corner-label'));
      showInReadingZone($('RZ_INTERACTED')); // bring back to reach the "Collapse" button
      await sleep(200);
      const collapseBtn = $('RZ_INTERACTED').querySelector(':scope > .jev-corner-label .jev-btn-collapse');
      check('Nút "Thu gọn" có mặt trên nhãn góc', !!collapseBtn);
      if (collapseBtn) collapseBtn.click();
      await waitFor(() => isCollapsed('RZ_INTERACTED'));
      check('Bấm "Thu gọn" thu gọn ngay dù đang xem',
        status('RZ_INTERACTED') === 'hidden' && isCollapsed('RZ_INTERACTED') && !!bannerOf('RZ_INTERACTED'));
      scrollAway();
      await sleep(100);

      // --- Quét ngầm (Silent Scanning): hoàn toàn không làm mờ và không chèn component "Đang kiểm tra" ---
      backendDelayMs = 1000;
      const pend = document.createElement('div');
      pend.id = 'RZ_PENDING';
      pend.innerHTML = postHTML({ author: 'Trang P', body: 'Kèo cá độ hot nhất tối nay' });
      document.querySelector('[role="feed"]').appendChild(pend);
      showInReadingZone($('RZ_PENDING')); // in place before the first scan
      await sleep(500); // give time for registration
      const hasPendingTag = !!$('RZ_PENDING').querySelector(':scope > .jev-blur-tag-pending');
      const isPostBlurred = $('RZ_PENDING').classList.contains('jev-blurred-post');
      check('Quét ngầm: bài mới trong vùng đọc KHÔNG bị mờ khi đang chờ AI', !isPostBlurred);
      check('Quét ngầm: tuyệt đối KHÔNG chèn thẻ "Đang kiểm tra..." gây gián đoạn lướt feed', !hasPendingTag);
      // Tương tác của người dùng trong lúc bài đang chờ AI vẫn được tôn trọng
      $('RZ_PENDING').querySelector('[role="toolbar"]').click();
      await waitFor(() => status('RZ_PENDING') === 'hidden');
      check('Tương tác trong lúc quét: quyết định ẩn chỉ gắn nhãn góc (không giật bài đang xem)',
        status('RZ_PENDING') === 'hidden' && !!$('RZ_PENDING').querySelector(':scope > .jev-corner-label') && !bannerOf('RZ_PENDING'));
      check('Nội dung không bị gián đoạn hay kẹt mờ', !$('RZ_PENDING').classList.contains('jev-blurred-post'));
      backendDelayMs = 60;
      scrollAway();
      await sleep(100);

      // --- Local "jank avoided" metric reported to the background worker ---
      const uxMetrics = messages.filter(m => m.action === 'UX_METRIC');
      check('Số lần tránh giật khung hình được báo cho worker (UX_METRIC)',
        uxMetrics.length > 0 && uxMetrics.some(m => m.deferred > 0), JSON.stringify(uxMetrics));

      // --- Regression: extension reloaded while a batch is still pending ---
      // The orphaned content script must shut down silently: no API call, no
      // "Extension context invalidated" warn, no further scanning. MUST run
      // last — it kills the engine (shutdown() is one-way).
      const warns = [];
      const origWarn = console.warn;
      console.warn = (...a) => { warns.push(a.map(String).join(' ')); origWarn.apply(console, a); };

      const dead = document.createElement('div');
      dead.id = 'CTX_DEAD';
      dead.innerHTML = postHTML({ author: 'Trang Z', body: 'Kèo cá độ giữa hiệp, vào nhanh!' });
      document.querySelector('[role="feed"]').appendChild(dead);

      // Wait (via MutationObserver microtask — deterministically inside the
      // 80ms batch window) until the post is QUEUED with the flush timer
      // pending: the exact race from the "Extension context invalidated" report.
      await new Promise(res => {
        const mo = new MutationObserver(() => {
          if (status('CTX_DEAD') === 'analyzing') { mo.disconnect(); res(); }
        });
        mo.observe(dead, { attributes: true, attributeFilter: ['data-jev-status'] });
        setTimeout(res, 4000); // safety net only
      });
      check('Repro: bài đã vào hàng chờ AI (flush timer pending) trước khi reload',
        status('CTX_DEAD') === 'analyzing', String(status('CTX_DEAD')));
      const callsAtInvalidate = calls.length;

      // Extension reloads right here: this content-script copy is orphaned.
      chrome.runtime.id = undefined;

      await sleep(400); // >> BATCH_INTERVAL_MS (80): the pending flush MUST have fired
      check('Context invalidated: batch đang chờ KHÔNG gửi API sau reload',
        calls.length === callsAtInvalidate, `calls ${callsAtInvalidate} -> ${calls.length}`);
      check('Context invalidated: không warn "Extension context invalidated" / "Lỗi gửi batch"',
        !warns.some(w => w.includes('invalidated') || w.includes('gửi batch')), warns.join(' | '));

      // The engine stays shut down: further DOM churn produces no scan/calls.
      const dead2 = document.createElement('div');
      dead2.id = 'CTX_DEAD2';
      dead2.innerHTML = postHTML({ author: 'Trang Z2', body: 'Thêm kèo cá độ sau reload' });
      document.querySelector('[role="feed"]').appendChild(dead2);
      await sleep(800); // > SCAN_THROTTLE_MS + idle + a heartbeat slice
      check('Context invalidated: engine shutdown hoàn toàn, DOM mới không được quét',
        calls.length === callsAtInvalidate && !status('CTX_DEAD2'), String(status('CTX_DEAD2')));

      console.warn = origWarn;

      results.done = true;
      const summary = document.createElement('div');
      summary.innerHTML = `<b>${results.failed === 0 ? 'ALL PASSED' : 'FAILURES'}: ${results.passed} passed, ${results.failed} failed</b>`;
      $('log').appendChild(summary);
    }
    run().catch(e => { results.done = true; results.failed++; results.failures.push(String(e)); check('harness error', false, String(e)); });
  </script>
</body>
</html>
